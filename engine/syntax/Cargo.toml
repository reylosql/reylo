[package]
name = "reylo-sql"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license = "MIT AND PostgreSQL AND BSD-3-Clause AND Apache-2.0"
repository.workspace = true
homepage.workspace = true
description = "Lossless SQL syntax trees for every database Reylo reads, generated from a database's own grammar where its license allows, and MySQL's from TiDB's."

[lib]
name = "reylo_sql"

[build-dependencies]
reylo-engine-build.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
