[package]
name = "reylo-engine-mysql"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Reylo's analysis engine for MySQL: the server's prepare metadata and the statement's syntax tree, the row-count proof and the nested JSON shapes, over the core's protocol."

[lib]
name = "reylo_engine_mysql"

[build-dependencies]
reylo-engine-build.workspace = true

[dependencies]
reylo-engine-core.workspace = true
syntax.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "unbounded_depth"] }

[dev-dependencies]
# The server the table of strict built-ins is measured on (`tests/strict.rs`).
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust"] }
tokio = { version = "1", features = ["rt"] }
